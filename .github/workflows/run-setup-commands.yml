name: Run setup commands

on:
    workflow_dispatch:
      inputs:      
        run_cleanup_environment:
          description: Run cleanup environment
          required: true
          type: boolean
          default: false

      setup_demo1
          description: Setup Demo 1
          required: true
          type: boolean
          default: false

jobs:
    deployment-job:
        name: Run setup command
        runs-on: ubuntu-22.04
        permissions:
          contents: write
          repository-projects: write          
        steps:
            - name: Check out the code
              uses: actions/checkout@v6

            - name: Set up Python
              uses: actions/setup-python@v6.2.0
              with:
                    python-version: "3.12"

            - name: Install python library packages
              run: |
                    pip install azure-identity msal microsoft-fabric-api fabric-cicd PyGitHub PyNaCl -q

    
            - name: Deploy solution to new workspace      
              env:
                AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
                AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
                AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}    
                AZURE_STORAGE_SAS_TOKEN: ${{ secrets.AZURE_STORAGE_SAS_TOKEN }}                
                FABRIC_CAPACITY_ID: ${{ secrets.FABRIC_CAPACITY_ID }}             
                ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
                DEVELOPERS_GROUP_ID: ${{ secrets.DEVELOPERS_GROUP_ID }}
                ADO_ORGANIZATION: ${{ secrets.ADO_ORGANIZATION }}
                ORGANIZATION_GITHUB: ${{ vars.ORGANIZATION_GITHUB }}
                APP_ID_GITHUB: ${{ secrets.APP_ID_GITHUB }}
                INSTALLATION_ID_GITHUB: ${{ secrets.INSTALLATION_ID_GITHUB }}
                PRIVATE_KEY_GITHUB: ${{ secrets.PRIVATE_KEY_GITHUB }}
                RUN_CLEANUP_ENVIRONMENT: ${{ inputs.run_cleanup_environment }}
                SETUP_DEMO1: ${{ inputs.setup_demo1 }}
              run:
                python src/run_setup_commands.py